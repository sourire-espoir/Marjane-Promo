<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marjane - Promotion Spéciale Ramadan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            background: white;
            border-radius: 15px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: #e31837;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 26px;
            font-weight: bold;
        }

        .header p {
            margin-top: 5px;
            font-size: 14px;
        }

        .wheel-section {
            padding: 25px 20px;
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 25px;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 8px solid #333;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .pointer {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #e31837;
            z-index: 10;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
        }

        .spin-btn {
            background: #e31837;
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 17px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(227,24,55,0.3);
        }

        .spin-btn:disabled {
            background: #999;
            cursor: not-allowed;
            box-shadow: none;
        }

        .spins-left {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }

        .result-box {
            display: none;
            margin: 0 20px 20px;
            padding: 15px;
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .share-section {
            display: none;
            margin: 0 20px 20px;
            padding: 20px;
            background: #f8f9fa;
            border: 2px solid #25D366;
            border-radius: 10px;
            text-align: center;
        }

        .share-section h3 {
            color: #e31837;
            margin-bottom: 10px;
        }

        .share-section p {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .share-btn {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 10px;
        }

        .comments-section {
            padding: 15px 20px;
            background: #fafafa;
            border-top: 1px solid #ddd;
        }

        .comments-section h3 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            color: #333;
        }

        .comment {
            background: white;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid #eee;
            font-size: 13px;
        }

        .comment-name {
            font-weight: bold;
            color: #333;
            font-size: 13px;
        }

        .comment-time {
            color: #999;
            font-size: 11px;
            float: right;
        }

        .comment-text {
            color: #555;
            margin-top: 3px;
            line-height: 1.4;
        }

        .verified {
            color: #25D366;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>MARJANE</h1>
            <p>🎉 Promotion Spéciale Ramadan 🎉</p>
        </div>

        <div class="wheel-section">
            <div class="wheel-container">
                <div class="pointer"></div>
                <canvas id="wheelCanvas" width="560" height="560"></canvas>
            </div>
            
            <button class="spin-btn" id="spinBtn" onclick="spin()">🎰 TOURNER LA ROUE</button>
            <div class="spins-left" id="spinsLeft">Tours restants: 3</div>
        </div>

        <div class="result-box" id="resultBox"></div>

        <div class="share-section" id="shareSection">
            <h3>🎊 Félicitations! 🎊</h3>
            <p>Pour recevoir votre prix, partagez avec:</p>
            <p>📱 <strong>5 contacts WhatsApp</strong></p>
            <p>👥 <strong>2 groupes WhatsApp</strong></p>
            <button class="share-btn" onclick="shareWhatsApp()">📤 Partager sur WhatsApp</button>
        </div>

        <div class="comments-section">
            <h3>💬 Gagnants Récents</h3>
            <div id="commentsContainer"></div>
        </div>
    </div>

    <script>
        const prizes = [
            { text: 'iPhone 15 Pro Max', color: '#e74c3c' },
            { text: '5000 Dirhams', color: '#f39c12' },
            { text: 'Rejouer', color: '#3498db' },
            { text: 'Google Play 100$', color: '#2ecc71' },
            { text: 'Rien', color: '#95a5a6' },
            { text: 'Petit Cadeau', color: '#9b59b6' },
            { text: 'Rejouer', color: '#1abc9c' },
            { text: 'iPhone 15 Pro Max', color: '#e67e22' }
        ];

        let spinsLeft = 3;
        let currentAngle = 0;
        let wonPrize = '';
        let firstSpin = true;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function drawWheel(rotation) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 10;
            const segments = prizes.length;
            const anglePerSegment = (2 * Math.PI) / segments;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            prizes.forEach((prize, index) => {
                const startAngle = index * anglePerSegment + rotation;
                const endAngle = startAngle + anglePerSegment;
                
                // Draw segment
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = prize.color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = 'center';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.fillText(prize.text, radius * 0.6, 6);
                ctx.restore();
            });
            
            // Center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 30, 0, 2 * Math.PI);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        function getWinningIndex(rotation) {
            const segments = prizes.length;
            const anglePerSegment = (2 * Math.PI) / segments;
            
            // Pointer is at top (270 degrees or -90 degrees in standard position)
            const pointerAngle = (3 * Math.PI) / 2; // 270 degrees
            
            // Normalize rotation
            const normalizedRotation = ((rotation % (2 * Math.PI)) + (2 * Math.PI)) % (2 * Math.PI);
            
            // Find which segment is under the pointer
            for (let i = 0; i < segments; i++) {
                const segmentStart = i * anglePerSegment;
                const segmentEnd = (i + 1) * anglePerSegment;
                
                // Check if pointer angle falls in this segment
                let checkAngle = pointerAngle;
                
                // Adjust for rotation
                let adjustedAngle = (checkAngle - normalizedRotation + (2 * Math.PI)) % (2 * Math.PI);
                
                if (adjustedAngle >= segmentStart && adjustedAngle < segmentEnd) {
                    return i;
                }
            }
            
            return 0;
        }

        function spin() {
            if (spinsLeft <= 0) {
                alert('Plus de tours disponibles!');
                return;
            }

            const button = document.getElementById('spinBtn');
            const resultBox = document.getElementById('resultBox');
            
            button.disabled = true;
            resultBox.style.display = 'none';
            document.getElementById('shareSection').style.display = 'none';

            // First, randomly choose the winning prize
            let winningIndex;
            
            if (firstSpin) {
                const goodIndexes = [0, 1, 3, 5, 7];
                winningIndex = goodIndexes[Math.floor(Math.random() * goodIndexes.length)];
                firstSpin = false;
            } else {
                winningIndex = Math.floor(Math.random() * prizes.length);
            }

            // Calculate exact angle to land on winning segment
            const segments = prizes.length;
            const anglePerSegment = (2 * Math.PI) / segments;
            
            // Pointer is at top (270 degrees)
            const pointerAngle = (3 * Math.PI) / 2;
            
            // Calculate target rotation so winning segment is at pointer
            const targetSegmentCenter = winningIndex * anglePerSegment + anglePerSegment / 2;
            const targetRotation = (pointerAngle - targetSegmentCenter + (2 * Math.PI)) % (2 * Math.PI);
            
            // Add full spins (5 complete rotations)
            const fullSpins = 5 * (2 * Math.PI);
            const totalRotation = fullSpins + targetRotation;
            
            const startTime = performance.now();
            const duration = 4000;
            const startAngle = currentAngle;

            function animate(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Easing function for smooth deceleration
                const eased = 1 - Math.pow(1 - progress, 3);
                const angle = startAngle + (totalRotation * eased);
                
                drawWheel(angle);
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    currentAngle = angle % (2 * Math.PI);
                    
                    // Verify winning index
                    const verifiedIndex = getWinningIndex(currentAngle);
                    const prize = prizes[verifiedIndex];
                    
                    wonPrize = prize.text;
                    
                    spinsLeft--;
                    document.getElementById('spinsLeft').textContent = `Tours restants: ${spinsLeft}`;
                    
                    if (prize.text === 'Rien') {
                        resultBox.textContent = '😅 Rien cette fois! Réessayez!';
                        resultBox.style.display = 'block';
                        button.disabled = false;
                    } else if (prize.text === 'Rejouer') {
                        resultBox.textContent = '🎰 Tour supplémentaire gagné!';
                        resultBox.style.display = 'block';
                        spinsLeft++;
                        document.getElementById('spinsLeft').textContent = `Tours restants: ${spinsLeft}`;
                        button.disabled = false;
                    } else {
                        resultBox.textContent = `🎉 Félicitations! Vous avez gagné: ${wonPrize}! 🎉`;
                        resultBox.style.display = 'block';
                        document.getElementById('shareSection').style.display = 'block';
                        button.disabled = true;
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        function shareWhatsApp() {
            const message = `🎉 J'ai gagné ${wonPrize} sur MARJANE! 🎉\n\n🔥 Promotion Spéciale Ramadan - Tentez votre chance!\n\n⚡ Offre limitée!`;
            window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
        }

        function createComments() {
            const comments = [
                { name: 'Yassine B.', text: 'Waaa machallah gelt mab9ach kayn chi 7aja bhal hadi, chokran Marjane! 🎉', time: '2 min' },
                { name: 'Fatima Z.', text: 'Sara7a kanet 3andi chak f lwel walakin daba weld l7el wselni, chokran bzaf! 😍', time: '5 min' },
                { name: 'Mehdi A.', text: 'Hhhh ana 3tani Google Play card, 3emrt biha chi 3 games, nadi! 🎮', time: '8 min' },
                { name: 'Salma R.', text: 'W3r had l promo, ana rbe7t 5000dh, kolchi jreb! 💰', time: '12 min' },
                { name: 'Omar T.', text: 'Ch7al hadi w ana kan9leb 3la chi promo mzyana, merci Marjane! 🙏', time: '15 min' },
                { name: 'Khadija M.', text: '3titha l khoya dyali w huwa tani rbe7, hadchi 7a9i9i! 😱', time: '20 min' },
                { name: 'Hamza L.', text: 'iPhone 15 Pro Max!!! Kan 7alem bih mn 3am, chokran chokran! 📱✨', time: '25 min' },
                { name: 'Amina K.', text: 'Madrtch belli ghadi nrbe7, walakin 7ta ana rbe7t! Jrebo ntoma! 💪', time: '30 min' },
                { name: 'Youssef B.', text: 'Sift l sa7abi w kolhom rbe7o, hadchi machi kdub! 🤩', time: '35 min' },
                { name: 'Nadia E.', text: 'Ana 3tani tour jdid w mn be3d rbe7t, chwiya d sabr w safi! 🎯', time: '40 min' },
                { name: 'Rachid H.', text: 'Wach hadchi 7a9i9i? 3tani 5000dh 3la wed direct! Chokran Marjane! 🏆', time: '45 min' },
                { name: 'Imane S.', text: 'Ba3da 3tani Google Play card, 3emret biha compte dyali, top! 🎮', time: '50 min' },
                { name: 'Karim D.', text: 'Salam, ana mn Casa w 3tani l prize f 3 jours, chokran! 🚚', time: '55 min' },
                { name: 'Sara B.', text: 'Mama kanet 3adza w nta liha 3la wed, rbe7t 3la wedha! 😂💝', time: '1h' },
                { name: 'Hassan M.', text: '7ta ana f lwel ma sde9tch, walakin l 7a9i9a kat3awed! 🎊', time: '1h' },
                { name: 'Zineb A.', text: 'Rbe7t w sift l 5 sa7abi, kolhom 3jabhom l promo! 👏', time: '1h' },
                { name: 'Adil R.', text: 'Merci Marjane 3la had l promo, ntoma l 7a9i9iyin! 💯', time: '1h' },
                { name: 'Meryem T.', text: 'iPhone wsel, wlh 3ad 3jbtni l service, chokran! 📦', time: '2h' },
                { name: 'Soufiane K.', text: 'Jrebt ghir b se7a w rbe7t, hadchi 3la wed kolchi! 🎲', time: '2h' },
                { name: 'Laila N.', text: 'Chokran Marjane, hadi 2 mara nrbe7, kol mara m3a chi promo jdida! 🌟', time: '3h' }
            ];

            const container = document.getElementById('commentsContainer');
            
            comments.forEach(comment => {
                const div = document.createElement('div');
                div.className = 'comment';
                div.innerHTML = `
                    <div>
                        <span class="comment-name">${comment.name} <span class="verified">✔️</span></span>
                        <span class="comment-time">il y a ${comment.time}</span>
                    </div>
                    <div class="comment-text">${comment.text}</div>
                `;
                container.appendChild(div);
            });
        }

        // Initialize
        drawWheel(0);
        createComments();
    </script>
</body>
</html>
